<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with extruded effect -->
  <circle cx="20" cy="20" r="18" fill="#e3e8f0" filter="url(#extruded)"/>
  
  <!-- Inner dot with inset effect -->
  <circle cx="20" cy="20" r="8" fill="oklch(70.4% 0.14 182.503)" filter="url(#inset)"/>

  <defs>
    <!-- Simple extruded shadow filter -->
    <filter id="extruded" x="-5" y="-5" width="50" height="50" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#c2c8d0" flood-opacity="0.8"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    
    <!-- Simple inset shadow filter for the inner dot to give it depth -->
    <filter id="inset" x="12" y="12" width="16" height="16" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dx="1" dy="1"/>
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceAlpha" in2="blur" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
      <feFlood flood-color="black" flood-opacity="0.1" result="color"/>
      <feComposite in="color" in2="shadow" operator="in" result="shadow1"/>
      
      <feOffset dx="-1" dy="-1"/>
      <feGaussianBlur stdDeviation="1" result="blur2"/>
      <feComposite in="SourceAlpha" in2="blur2" operator="arithmetic" k2="-1" k3="1" result="shadow2"/>
      <feFlood flood-color="white" flood-opacity="0.2" result="color2"/>
      <feComposite in="color2" in2="shadow2" operator="in" result="shadow3"/>
      
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="shadow3"/>
      </feMerge>
    </filter>
  </defs>
</svg>
